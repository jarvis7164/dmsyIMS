name: 部署到腾讯云服务器

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: 运行测试
    runs-on: ubuntu-latest
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
    
    - name: 设置 Python 环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest
    
    - name: 运行测试
      run: |
        # 这里可以添加你的测试命令
        # pytest tests/
        echo "测试通过"

  deploy:
    name: 部署到腾讯云服务器
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
    
    - name: 部署到服务器
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.SERVER_PORT || 22 }}
        script: |
          # 进入项目目录
          cd /opt/dmsyIMS
          
          # 拉取最新代码
          echo "正在拉取最新代码..."
          git pull origin main
          
          # 重新构建并启动 Docker 容器
          echo "正在重新构建并启动容器..."
          docker-compose down
          docker-compose up -d --build
          
          # 等待服务启动
          echo "等待服务启动..."
          sleep 10
          
          # 检查服务状态
          echo "检查服务状态..."
          docker-compose ps
          
          echo "✅ 部署完成！"
    
    - name: 部署成功通知
      if: success()
      run: |
        echo "🎉 部署成功！"
        echo "访问地址：http://${{ secrets.SERVER_HOST }}:8080"
    
    - name: 部署失败通知
      if: failure()
      run: |
        echo "❌ 部署失败！请检查日志。"
